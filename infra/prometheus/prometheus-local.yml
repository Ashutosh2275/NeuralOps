global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: sentinelops-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]

  - job_name: kubernetes-cadvisor
    scheme: https
    metrics_path: /api/v1/nodes/ashutosh/proxy/metrics/cadvisor
    tls_config:
      insecure_skip_verify: true
      cert_file: d:/NeuralOps/infra/prometheus/k8s-client.crt
      key_file: d:/NeuralOps/infra/prometheus/k8s-client.key
    static_configs:
      - targets: ["172.19.224.117:6443"]
