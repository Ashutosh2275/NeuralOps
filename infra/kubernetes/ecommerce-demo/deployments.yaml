# E-commerce demo workload for hackathon demos (intentionally stress-prone)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce-demo
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: order-service
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce-demo
spec:
  selector:
    app: order-service
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ecommerce-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: nginx:alpine
          resources:
            limits:
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ecommerce-demo
spec:
  selector:
    app: payment-service
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ecommerce-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: busybox
          command: ["sh", "-c", "while true; do echo crash; exit 1; done"]
          resources:
            limits:
              memory: "32Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: ecommerce-demo
spec:
  selector:
    app: inventory-service
  ports:
    - port: 80
