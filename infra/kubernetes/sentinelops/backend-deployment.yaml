apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelops-backend
  namespace: sentinelops
  labels:
    app: sentinelops-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinelops-backend
  template:
    metadata:
      labels:
        app: sentinelops-backend
    spec:
      serviceAccountName: sentinelops-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: sentinelops-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: sentinelops-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelops-backend
  namespace: sentinelops
spec:
  selector:
    app: sentinelops-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
