apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinelops-collector
  namespace: sentinelops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinelops-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events", "nodes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinelops-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentinelops-collector
subjects:
  - kind: ServiceAccount
    name: sentinelops-collector
    namespace: sentinelops
