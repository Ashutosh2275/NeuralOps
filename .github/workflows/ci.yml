name: SentinelOps Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-audit-and-tests:
    name: Backend Validation & Test Pyramid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/
          pip install pytest pytest-asyncio httpx

      - name: Syntax & Lint Validation
        run: |
          python -m compileall backend/src

      - name: Run Test Pyramid (Phase 1 to Phase 4)
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/src
          APP_ENV: test
        run: |
          pytest backend/tests -v --maxfail=5

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Dashboard & Verify Typecheck
        working-directory: frontend
        run: npm run build

  security-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for Hardcoded Credentials
        run: |
          python -c "
          import re, sys, os
          patterns = [
              (r'AKIA[0-9A-Z]{16}', 'AWS Key'),
              (r'-----BEGIN PRIVATE KEY-----', 'Private Key'),
              (r'ghp_[A-Za-z0-9]{36}', 'GitHub Token'),
          ]
          found = False
          for root, dirs, files in os.walk('.'):
              if any(p in root for p in ['.git', '.venv', 'node_modules', '__pycache__', 'tests', 'docs', 'data', 'scripts']):
                  continue
              for file in files:
                  if file.endswith(('.py', '.json', '.yaml', '.yml', '.ts', '.tsx')):
                      path = os.path.join(root, file)
                      try:
                          content = open(path, 'r', encoding='utf-8', errors='ignore').read()
                          for pat, name in patterns:
                              if re.search(pat, content):
                                  print(f'CRITICAL: {name} found in {path}')
                                  found = True
                      except Exception:
                          pass
          if found:
              sys.exit(1)
          print('Security credential scan clean.')
          "
